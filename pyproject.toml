[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-content-engineering-studio"
version = "0.9.0"
description = "Evidence-driven local AI content and course production pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "beautifulsoup4>=4.12,<5.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
# Intentional opt-in for the media phase; not installed by `uv sync`.
media = ["playwright>=1.48,<2.0"]
# Phase 1 browser QA. Install with `uv sync --extra browser`, then
# `uv run playwright install chromium`.
browser = ["playwright>=1.48,<2.0"]
# Phase 3 static chart rendering (Vega-Lite -> SVG). No Node.js required.
charts = ["vl-convert-python>=1.9,<2.0"]
# Phase 6 optional MCP stdio server.
mcp = ["mcp>=1.2,<2.0"]

[dependency-groups]
# Installed by default by `uv sync` (uv's "dev" group).
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.12,<2.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
lces = "content_studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "network: tests that require live network access; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer uses function calls in default arguments.
# UP007: `Optional[...]` is kept for compatibility with the declared Typer range.
ignore = ["B008", "UP007"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
mypy_path = "src"

[tool.coverage.run]
source = ["src/content_studio"]
