name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked, charts extra)
        run: uv sync --locked --extra charts
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest

  graphviz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Record Graphviz version
        run: dot -V 2>&1 | tee graphviz-version.txt
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Record LCES environment
        run: uv run lces doctor | tee graphviz-doctor.txt
      - name: Graphviz adapter tests
        run: uv run pytest tests/test_graphviz.py -v --junitxml=graphviz-report.xml
      - name: Upload Graphviz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphviz-evidence
          path: |
            graphviz-version.txt
            graphviz-doctor.txt
            graphviz-report.xml
          if-no-files-found: error

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked, browser extra)
        run: uv sync --locked --extra browser
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser QA tests
        run: uv run pytest tests/test_browser_qa.py
