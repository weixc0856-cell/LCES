name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies
        # Switch to `uv sync --locked` after the regenerated uv.lock (Python 3.13)
        # has been committed.
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Type check (advisory)
        run: uv run mypy src || true
      - name: Tests
        run: uv run pytest
