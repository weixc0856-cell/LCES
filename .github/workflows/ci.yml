name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      keep_frames:
        description: "Upload the production frame sequence (about 17 MB) for evidence checks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked, charts extra)
        run: uv sync --locked --extra charts
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Supply-chain pin audit
        run: uv run lces supply-chain-check
      - name: Tests
        run: uv run pytest

  motion-canvas-p1:
    # P1 is Linux-only. This job runs the real editor; a missing dependency
    # fails the job instead of skipping the integration test.
    #
    # The pinned Playwright image already contains the Chromium build for
    # 1.64.0 and its system libraries, so the old
    # `playwright install --with-deps chromium` (apt every run) is gone.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    defaults:
      run:
        # Container jobs default to sh, which has no pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Install Motion Canvas dependencies
        run: |
          cd motion
          npm ci --no-audit --no-fund
          npm rebuild esbuild
      - name: Ensure FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          else
            apt-get update && apt-get install -y ffmpeg
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Record environment
        run: |
          set -o pipefail
          mkdir -p motion-evidence
          echo "container=mcr.microsoft.com/playwright:v1.64.0-noble" \
            | tee motion-evidence/runner.txt
          node --version | tee motion-evidence/node-version.txt
          npm --version | tee motion-evidence/npm-version.txt
          (cd motion && npx playwright --version) | tee motion-evidence/playwright-version.txt
          (cd motion && node -e "const {chromium} = require('playwright'); process.stdout.write(chromium.executablePath())") \
            | tee motion-evidence/chromium-path.txt
          ffmpeg -version | sed -n '1p' | tee motion-evidence/ffmpeg-version.txt
          uv run lces doctor | tee motion-evidence/doctor.txt
      - name: Node contract tests
        run: |
          set -o pipefail
          cd motion
          node --test --test-reporter=tap contract.test.mjs output-dir.test.mjs network-policy.test.mjs \
            | tee ../motion-evidence/contract-tests.tap
      - name: Real title renders
        run: >-
          LCES_MC_E2E=1 uv run pytest tests/test_motion_canvas_e2e.py tests/test_motion_canvas_templates.py tests/test_motion_canvas_production.py tests/test_encode.py tests/test_release_video.py -v
          --basetemp=/tmp/lces-p1-builds
          --junitxml=motion-evidence/e2e-report.xml
      - name: Collect frame manifests
        if: always()
        run: |
          uv run python scripts/collect-motion-evidence.py             --root /tmp/lces-p1-builds --out motion-evidence
      - name: Audit evidence for secrets and host paths
        if: always()
        run: |
          set -o pipefail
          uv run python scripts/audit-evidence.py motion-evidence | tee motion-evidence/evidence-audit.txt
      - name: Stage production frames
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_frames }}
        run: |
          uv run python scripts/collect-motion-evidence.py             --root /tmp/lces-p1-builds --out motion-evidence             --keep-frames --frames-out p1-frames
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p motion-evidence/failure
          cp -r /tmp/lces-p1-builds/* motion-evidence/failure/ 2>/dev/null || true
      - name: Upload P1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-canvas-p1-evidence
          path: motion-evidence/
          if-no-files-found: error

  motion-canvas-offline:
    # P1.4: build the image with network, then render, encode and run Gate 4
    # with `--network none`. Negative controls must fail in the same container;
    # a missing tool or a reachable network fails the job instead of skipping.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the offline image
        run: docker build -f motion/offline.Dockerfile -t lces-motion-offline .
      - name: Record image identity and inputs
        run: |
          set -o pipefail
          mkdir -p offline-evidence
          docker image inspect lces-motion-offline --format '{{.Id}}' \
            | tee offline-evidence/image-id.txt
          sha256sum motion/package-lock.json uv.lock motion/offline.Dockerfile \
            | tee offline-evidence/input-hashes.txt
      - name: Offline render and negative controls
        run: |
          docker run --rm --network none --memory=2048m --memory-swap=2048m \
            -v "$PWD/offline-evidence:/evidence" \
            -e LCES_OFFLINE_EVIDENCE=/evidence \
            lces-motion-offline
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-canvas-offline-evidence
          path: offline-evidence/
          if-no-files-found: error

  graphviz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Record Graphviz version
        run: dot -V 2>&1 | tee graphviz-version.txt
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Record LCES environment
        run: uv run lces doctor | tee graphviz-doctor.txt
      - name: Graphviz adapter tests
        run: uv run pytest tests/test_graphviz.py -v --junitxml=graphviz-report.xml
      - name: Collect evidence and audit it for secrets and host paths
        if: always()
        run: |
          mkdir -p graphviz-evidence
          cp graphviz-version.txt graphviz-doctor.txt graphviz-report.xml graphviz-evidence/ 2>/dev/null || true
          uv run python scripts/audit-evidence.py graphviz-evidence | tee graphviz-evidence/evidence-audit.txt
      - name: Upload Graphviz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphviz-evidence
          path: graphviz-evidence/
          if-no-files-found: error

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked, browser extra)
        run: uv sync --locked --extra browser
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser QA tests
        run: uv run pytest tests/test_browser_qa.py
