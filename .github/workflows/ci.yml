name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      keep_frames:
        description: "Upload the production frame sequence (about 17 MB) for evidence checks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked, charts extra)
        run: uv sync --locked --extra charts
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest

  motion-canvas-p1:
    # P1 is Linux-only. This job runs the real editor; a missing dependency
    # fails the job instead of skipping the integration test.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Install Motion Canvas dependencies
        run: |
          cd motion
          npm ci --no-audit --no-fund
          npm rebuild esbuild
      - name: Install Chromium
        run: cd motion && npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Record environment
        run: |
          set -o pipefail
          mkdir -p motion-evidence
          node --version | tee motion-evidence/node-version.txt
          npm --version | tee motion-evidence/npm-version.txt
          (cd motion && npx playwright --version) | tee motion-evidence/playwright-version.txt
          ffmpeg -version | sed -n '1p' | tee motion-evidence/ffmpeg-version.txt
          uv run lces doctor | tee motion-evidence/doctor.txt
      - name: Node contract tests
        run: |
          set -o pipefail
          cd motion
          node --test --test-reporter=tap contract.test.mjs | tee ../motion-evidence/contract-tests.tap
      - name: Real title renders
        run: >-
          LCES_MC_E2E=1 uv run pytest tests/test_motion_canvas_e2e.py -v
          --basetemp=/tmp/lces-p1-builds
          --junitxml=motion-evidence/e2e-report.xml
      - name: Collect frame manifests
        if: always()
        run: |
          set -euo pipefail
          mkdir -p motion-evidence/manifests /tmp/lces-p1-builds
          for manifest in $(find /tmp/lces-p1-builds -name frame_manifest.json 2>/dev/null); do
            build_dir=$(dirname "$manifest")
            build_id=$(basename "$build_dir")
            mkdir -p "motion-evidence/manifests/$build_id"
            cp "$manifest" "motion-evidence/manifests/$build_id/"
            cp "$build_dir/frames/report.json" "motion-evidence/manifests/$build_id/" 2>/dev/null || true
            cp "$build_dir/driver.log" "motion-evidence/manifests/$build_id/" 2>/dev/null || true
            first=$(find "$build_dir/frames" -name '000000.png' 2>/dev/null | head -1)
            if [ -n "$first" ]; then
              cp "$first" "motion-evidence/manifests/$build_id/first.png"
              last=$(find "$build_dir/frames" -name '*.png' 2>/dev/null | sort | tail -1)
              cp "$last" "motion-evidence/manifests/$build_id/last.png"
            fi
          done
      - name: Stage production frames
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_frames }}
        run: |
          set -euo pipefail
          for manifest in $(find /tmp/lces-p1-builds -name frame_manifest.json 2>/dev/null); do
            if grep -q '"total_frames": 300' "$manifest"; then
              build_dir=$(dirname "$manifest")
              build_id=$(basename "$build_dir")
              mkdir -p "p1-frames/$build_id"
              cp "$manifest" "p1-frames/$build_id/"
              cp "$build_dir/frames/report.json" "p1-frames/$build_id/" 2>/dev/null || true
              cp "$build_dir/driver.log" "p1-frames/$build_id/" 2>/dev/null || true
              cp -r "$build_dir/frames" "p1-frames/$build_id/frames"
            fi
          done
      - name: Upload production frames
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_frames }}
        uses: actions/upload-artifact@v4
        with:
          name: motion-canvas-p1-frames
          path: p1-frames/
          if-no-files-found: error
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p motion-evidence/failure
          cp -r /tmp/lces-p1-builds/* motion-evidence/failure/ 2>/dev/null || true
      - name: Upload P1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-canvas-p1-evidence
          path: motion-evidence/
          if-no-files-found: error

  graphviz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Record Graphviz version
        run: dot -V 2>&1 | tee graphviz-version.txt
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Record LCES environment
        run: uv run lces doctor | tee graphviz-doctor.txt
      - name: Graphviz adapter tests
        run: uv run pytest tests/test_graphviz.py -v --junitxml=graphviz-report.xml
      - name: Upload Graphviz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphviz-evidence
          path: |
            graphviz-version.txt
            graphviz-doctor.txt
            graphviz-report.xml
          if-no-files-found: error

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies (locked, browser extra)
        run: uv sync --locked --extra browser
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser QA tests
        run: uv run pytest tests/test_browser_qa.py
