# Opt-in routing: `lces run <project> --routing config/routing.yaml`
# or set LCES_ROUTING_FILE=config/routing.yaml.
#
# Only model-calling stages can be routed: research, outline, generate.
# Ingest/build/validate never call a model.
#
# `research` leans on the stronger cloud model for multi-source synthesis and
# evidence checks; drafting runs locally. Change this only after benchmarking
# the local model on real material.

default: local

stages:
  research: deepseek
  outline: local
  generate: local
