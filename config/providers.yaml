# Provider definitions. Secrets belong in .env, never in this file.
# `mock` is deterministic and never publishable; release gates reject it.
providers:
  mock:
    adapter: mock
    model: mock-deterministic

  # llama.cpp `llama-server` (OpenAI-compatible). Start it with D:\AI\start_server.bat:
  # SYCL backend, Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf, profile [4]
  # (CPU-MoE 48 layers @ 32K). See docs/LOCAL_MODEL.md.
  # The model ID is discovered from /v1/models when `model` is empty.
  local:
    adapter: local_llama_cpp
    base_url: http://127.0.0.1:8080/v1
    model: ""
    json_mode: true

  deepseek:
    adapter: openai_compatible
    base_url: https://api.deepseek.com/v1
    # Verify the current model IDs against https://api-docs.deepseek.com/ before production use.
    model: deepseek-chat
    api_key_env: LCES_DEEPSEEK_API_KEY

  anthropic:
    adapter: anthropic
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    api_key_env: LCES_ANTHROPIC_API_KEY

default_provider: mock
